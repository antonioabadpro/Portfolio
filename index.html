<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AAHG - Antonio Abad Hernández Gálvez</title>

    <link rel="canonical" href="https://antonioabadpro.netlify.app/">
    <link rel="alternate" hreflang="es" href="https://antonioabadpro.netlify.app/es/">
    <link rel="alternate" hreflang="en" href="https://antonioabadpro.netlify.app/en/">
    <link rel="alternate" hreflang="x-default" href="https://antonioabadpro.netlify.app/en/">

    <meta name="robots" content="noindex, follow">

    <script>
        function redirigirSegunIdioma() {
            let idiomaGuardado = null;
            // Almacenamos la preferencia de idioma en localStorage si el usuario ya la ha seleccionado

            // Protección en caso de que localStorage esté deshabilitado/bloqueado
            try {
                idiomaGuardado = localStorage.getItem('idioma_preferido');
            } catch (e) { // Modo incógnito estricto o cookies restringidas

            }

            // Si el usuario tiene una preferencia de idioma (ha visitado la pagina antes), mantenemos su elección
            if (idiomaGuardado === 'en') {
                window.location.replace('/en/');
                return;
            }
            if (idiomaGuardado === 'es') {
                window.location.replace('/es/');
                return;
            }

            // Si el usuario NO tiene una preferencia de idioma (NO ha visitado la pagina antes), detectamos el idioma del navegador
            const idiomaNavegador = (navigator.language || navigator.userLanguage || '').toLowerCase();

            if (idiomaNavegador.startsWith('es')) {
                window.location.replace('/es/');
            }
            else { // Por defecto a inglés para cualquier otro idioma internacional
                window.location.replace('/en/');
            }
        }
        redirigirSegunIdioma();
    </script>
</head>

<body class="bg-slate-950 text-slate-100 flex items-center justify-center min-h-screen font-sans">
    <noscript>
        <div style="text-align:center; padding: 2rem; color: #fff;">
            <h1>Selecciona tu idioma / Select your language</h1>
            <p>
                <a href="./es/" style="color: #10b981; margin-right: 1.5rem; text-decoration: underline;">Español</a>
                <a href="./en/" style="color: #10b981; text-decoration: underline;">English</a>
            </p>
        </div>
    </noscript>
</body>

</html>
