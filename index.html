<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Antonio Abad Hernández Gálvez | Ingeniero de Software</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Configuración personalizada de Tailwind para animaciones -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    animation: {
                        'fade-in-up': 'fadeInUp 1s cubic-bezier(0.4, 0, 0.2, 1) forwards',
                        'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    },
                    keyframes: {
                        fadeInUp: {
                            '0%': { opacity: '0', transform: 'translateY(20px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        }
                    }
                }
            }
        }
    </script>

    <!-- Estilos adicionales para el fondo animado y retrasos en la entrada -->
    <style type="text/tailwindcss">
        @layer utilities {
            .animation-delay-100 { animation-delay: 150ms; }
            .animation-delay-200 { animation-delay: 300ms; }
            .animation-delay-300 { animation-delay: 450ms; }
            .animation-delay-400 { animation-delay: 600ms; }
        }
        
        .bg-gradient-animate {
            background: linear-gradient(-45deg, #0f172a, #1e293b, #0f172a, #312e81);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
        }
        
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
    </style>
</head>
<body class="bg-gradient-animate text-slate-200 min-h-screen flex items-center justify-center p-6 selection:bg-indigo-500 selection:text-white font-sans overflow-hidden">

    <!-- Luces de fondo decorativas -->
    <div class="absolute top-0 left-0 w-full h-full overflow-hidden pointer-events-none -z-10">
        <div class="absolute top-[-10%] left-[-10%] w-96 h-96 bg-indigo-600 rounded-full mix-blend-multiply filter blur-[128px] opacity-30 animate-pulse-slow"></div>
        <div class="absolute bottom-[-10%] right-[-10%] w-96 h-96 bg-blue-600 rounded-full mix-blend-multiply filter blur-[128px] opacity-30 animate-pulse-slow" style="animation-delay: 2s;"></div>
    </div>

    <!-- Contenedor Principal -->

        <!-- Icono de Código -->

            <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 text-indigo-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4" />
            </svg>
        </div>

        <!-- Encabezado -->
        <h1 class="text-4xl md:text-6xl font-bold mb-4 tracking-tight opacity-0 animate-fade-in-up animation-delay-100 text-transparent bg-clip-text bg-gradient-to-r from-slate-100 to-slate-400">
            Antonio Abad <br>Hernández Gálvez
        </h1>

        <p class="text-lg md:text-2xl text-indigo-300 mb-10 font-light opacity-0 animate-fade-in-up animation-delay-200 tracking-wide">
            Ingeniero Informático &bull; Ingeniero de Software
        </p>

        <!-- Caja de Estado: Work in Progress -->
        <div class="opacity-0 animate-fade-in-up animation-delay-300 bg-slate-800/40 border border-slate-700/50 backdrop-blur-md rounded-2xl p-8 w-full max-w-lg mx-auto shadow-2xl transition-all duration-300 hover:border-indigo-500/30">
            <div class="flex items-center justify-center space-x-3 mb-4">
                <span class="relative flex h-3 w-3">
                  <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-indigo-400 opacity-75"></span>
                  <span class="relative inline-flex rounded-full h-3 w-3 bg-indigo-500"></span>
                </span>
                <h2 class="text-xl md:text-2xl font-semibold text-white tracking-wide uppercase text-sm">Work in Progress</h2>
            </div>
            <p class="text-slate-400 text-sm md:text-base leading-relaxed">
                Mi portfolio personal está actualmente en desarrollo. Muy pronto estará disponible con mis proyectos.
            </p>

            <!-- Barra de progreso simulada -->
            <div class="mt-8 w-full bg-slate-900 rounded-full h-1.5 mb-2 overflow-hidden shadow-inner">
              <div class="bg-gradient-to-r from-indigo-600 to-blue-400 h-1.5 rounded-full w-2/3 animate-pulse"></div>
            </div>
            <p class="text-xs text-slate-500 text-right mt-2">Q4 2026...</p>
        </div>

                <span class="sr-only">GitHub</span>

            </a>
            <a href="https://www.linkedin.com/in/antonioabadhernandezgalvez/" target="_blank" rel="noopener noreferrer" class="text-slate-400 hover:text-[#0077b5] hover:scale-110 transition-all duration-300 drop-shadow-lg hover:drop-shadow-[#0077b5]/50">
                <span class="sr-only">LinkedIn</span>
                <svg class="h-8 w-8" fill="currentColor" viewBox="0 0 24 24"><path fill-rule="evenodd" d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.79-1.75-1.764s.784-1.764 1.75-1.764 1.75.79 1.75 1.764-.783 1.764-1.75 1.764zm13.5 12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z" clip-rule="evenodd"/></svg>

        </div>
    </main>

</body>
</html>
