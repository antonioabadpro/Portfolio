# ================================================
# Configuración del Build y Despliegue
# ================================================

[build]
  command = "node build.js"
  publish = "."

# Hacemos que Netlify compile Tailwind automáticamente en cada despliegue
[build]
  command = "npx tailwindcss -i ./css/styles.css -o ./css/styles.min.css --minify && node build.js"
  publish = "."  

[[redirects]]
  from = "/"
  to = "/es/"
  status = 302
  force = false
  conditions = {Language = ["es"]}

[[redirects]]
  from = "/"
  to = "/en/"
  status = 302
  force = false

# ================================================
# Cabeceras de Caché para Optimización de Carga
# ================================================

[[headers]]
  # Cachear imágenes estáticas por 1 año de forma inmutable
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  # Cachear estilos CSS compilados
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"